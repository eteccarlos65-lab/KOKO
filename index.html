<script>

{id:1,t:'O Prédio',s:'O primeiro salto, sem corda',H:22,base:0,wind:0,cold:0,sky:['#31465e','#d9a47a'],rock:'#6b6a6e',

{id:6,t:'K2, Face Leste',s:'A face intocada',H:70,base:7900,wind:1,cold:1,sky:['#05080f','#6f87a3'],rock:'#9aa7b4',

/* ===== Camada de dados: Supabase ou localStorage (mesma API de CRUD) ===== */
let sb=null,uid='local';
const L=t=>JSON.parse(localStorage.getItem('tc_'+t)||'[]'),W=(t,a)=>localStorage.setItem('tc_'+t,JSON.stringify(a));
const db={
 async list(t){if(sb){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});return data||[]}return L(t)},
 async ins(t,row){if(sb){const{data}=await sb.from(t).insert(row).select().single();return data}
  const r={...row,id:crypto.randomUUID(),created_at:new Date().toISOString()};W(t,[r,...L(t)]);return r},
 async upd(t,id,p){if(sb)await sb.from(t).update(p).eq('id',id);else W(t,L(t).map(r=>r.id==id?{...r,...p}:r))},
 async del(t,id){if(sb)await sb.from(t).delete().eq('id',id);else W(t,L(t).filter(r=>r.id!=id))}};
async function initDb(){
 try{if(SB_URL&&window.supabase){sb=supabase.createClient(SB_URL,SB_KEY);
  let{data:{session}}=await sb.auth.getSession();if(!session){session=(await sb.auth.signInAnonymously()).data.session}uid=session.user.id}}catch(e){sb=null}
 $('#dbS').textContent=sb?'Conectado ao Supabase.':'Modo offline (localStorage). Preencha SB_URL e SB_KEY para usar o Supabase.'}

/* ===== Estado ===== */
const $=s=>document.querySelector(s);
let save=null,chap=CH[0],holds=[],cur=null,stam=100,state='menu',moves=0,t0=0,maxP=0,shown=new Set(),idle=0,resting=false,gust=8;

/* ===== Cena 3D ===== */
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;document.body.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,900);
const world=new THREE.Group();scene.add(world);
const hemi=new THREE.HemisphereLight(0xbcd2ff,0x2a2a30,.9),sun=new THREE.DirectionalLight(0xffd9a8,1.6);sun.position.set(-8,20,14);scene.add(hemi,sun);
const noise=(x,y)=>Math.sin(x*.9+y*.4)*.25+Math.sin(x*.3-y*.8)*.3+Math.sin(x*2.1+y*1.7)*.08;
const fbm=x=>Math.sin(x*.07)*8+Math.sin(x*.19+2)*4+Math.sin(x*.43+5)*1.5;
const hand=new THREE.Group(),body=new THREE.Group();
(()=>{const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
 const tor=new THREE.Mesh(new THREE.BoxGeometry(.5,.8,.3),M(0xc43d2e));tor.position.y=-.3;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),M(0xe8c3a0));head.position.y=.3;
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.21,16,12,0,6.3,0,1.4),M(0x1a1410));hair.position.y=.32;
 const leg=new THREE.Mesh(new THREE.BoxGeometry(.4,.8,.25),M(0x2b3446));leg.position.y=-1.1;
 const dk=new THREE.MeshStandardMaterial({color:0x120d0a});
 for(const x of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.028,8,6),dk);e.position.set(x*.07,.32,-.185);const br=new THREE.Mesh(new THREE.BoxGeometry(.1,.02,.02),dk);br.position.set(x*.07,.38,-.19);br.rotation.z=x*.35;head.add(e,br)}
 body.add(tor,head,hair,leg);
 for(const x of[-.25,.25]){const h=new THREE.Mesh(new THREE.SphereGeometry(.1,10,8),M(0xe8c3a0));h.position.set(x,.5,0);hand.add(h)}})();
scene.add(body,hand);
let snow;{const g=new THREE.BufferGeometry(),a=new Float32Array(900);for(let i=0;i<a.length;i++)a[i]=(Math.random()-.5)*40;
 g.setAttribute('position',new THREE.BufferAttribute(a,3));snow=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:.09,transparent:true,opacity:.85}));scene.add(snow)}

function buildChapter(c){
 world.clear();const H=c.H;
 const cv=document.createElement('canvas');cv.width=2;cv.height=256;const x=cv.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,c.sky[0]);g.addColorStop(1,c.sky[1]);x.fillStyle=g;x.fillRect(0,0,2,256);scene.background=new THREE.CanvasTexture(cv);
 const fog=new THREE.Color(c.sky[1]);scene.fog=new THREE.Fog(fog,25,260+c.cold*-60);
 sun.color.set(c.id==3?0x9bb4ff:c.cold>.5?0xdfeeff:0xffd9a8);sun.intensity=c.id==3?.9:1.6;
 for(let i=0;i<6;i++){const s=new THREE.Shape(),w=300;s.moveTo(-w,-80);
  for(let k=-w;k<=w;k+=3)s.lineTo(k,30+i*7+fbm(k+i*91)*(1+i*.3)+Math.abs(Math.sin(k*.05+i))*7*(i+1)*.4);s.lineTo(w,-80);
  const col=new THREE.Color(c.rock).multiplyScalar(.45).lerp(fog,i/5.5);
  const m=new THREE.Mesh(new THREE.ShapeGeometry(s),new THREE.MeshBasicMaterial({color:col,fog:false}));m.position.set(0,-10+i*3+H*.12,-70-i*55);m.scale.set(1+i*.4,1+i*.25,1);world.add(m)}
 const wg=new THREE.PlaneGeometry(16,H+10,32,Math.round(H+10)).translate(0,H/2-3,0),p=wg.attributes.position;
 for(let i=0;i<p.count;i++)p.setZ(i,noise(p.getX(i),p.getY(i)));wg.computeVertexNormals();
 world.add(new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:c.rock,roughness:.95,flatShading:true})));
 holds=[];const hm=new THREE.MeshStandardMaterial({color:new THREE.Color(c.rock).offsetHSL(0,0,.18),roughness:.7,flatShading:true});
 for(let r=0;r<=H;r++)for(let k=-3;k<=3;k++){if(r>0&&Math.random()>.62)continue;
  const hx=k*1.1+(Math.random()-.5)*.5,hy=r+(Math.random()-.5)*.4;addHold(hx,hy,hm)}
 addHold(0,H,new THREE.MeshStandardMaterial({color:0xffd27a,emissive:0xffa530,emissiveIntensity:.8}),true);
 for(let k=0;k<4;k++){const l=new THREE.PointLight(0xffa530,0,12);l.position.set(0,H,2);}
 cur=holds.reduce((a,b)=>Math.hypot(b.pos.x,b.pos.y)<Math.hypot(a.pos.x,a.pos.y)?b:a);
 placePlayer(cur);}
function addHold(x,y,mat,top){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(top?.3:.17+Math.random()*.08,0),mat);
 m.position.set(x,y,noise(x,y)+.12);m.rotation.set(Math.random()*6,Math.random()*6,0);world.add(m);holds.push({pos:m.position,mesh:m,top})}
function placePlayer(h){hand.position.set(h.pos.x,h.pos.y,h.pos.z+.2);body.position.set(h.pos.x,h.pos.y-.5,h.pos.z+.35);}

/* ===== Gameplay ===== */
function startChapter(c){
 chap=c;buildChapter(c);stam=100;moves=0;maxP=0;shown=new Set();gust=6;state='play';t0=performance.now();
 $('#menu').style.display='none';$('#cT').textContent='Cap. '+c.id+' — '+c.t;$('#cS').textContent=c.s;
 gsap.fromTo('#hud',{opacity:0,y:-20},{opacity:1,y:0,duration:1.2});cam.position.set(0,2,16);
 mono('Cap. '+c.id+' — '+c.t,2.5)}
function move(dx,dy){
 if(state!=='play')return;let best=null,bd=1e9;
 for(const h of holds){if(h===cur)continue;const vx=h.pos.x-cur.pos.x,vy=h.pos.y-cur.pos.y,d=Math.hypot(vx,vy);
  if(d<.4||d>2.4)continue;if((vx*dx+vy*dy)/d<.5)continue;if(d<bd){bd=d;best=h}}
 if(!best)return gsap.fromTo(body.position,{x:cur.pos.x-.05},{x:cur.pos.x,duration:.2});
 state='move';moves++;const cost=6+bd*2.5+chap.wind*4+chap.cold*3+(dy>0?2:0);stam=Math.max(0,stam-cost);
 gsap.to(hand.position,{x:best.pos.x,y:best.pos.y,z:best.pos.z+.2,duration:.4,ease:'power2.out'});
 gsap.to(body.position,{x:best.pos.x,y:best.pos.y-.5,z:best.pos.z+.35,duration:.5,ease:'power2.inOut',onComplete(){
  cur=best;state='play';const pr=cur.pos.y/chap.H;maxP=Math.max(maxP,pr);story(pr);if(cur.top)summit();else if(!crewEv(pr)&&stam<=0)fall()}});}
function mono(t,d=4){const e=$('#mono');e.textContent='';gsap.killTweensOf(e);const o={n:0};
 gsap.timeline().to(e,{opacity:1,duration:.6}).to(o,{n:t.length,duration:Math.min(2.5,t.length*.05),ease:'none',onUpdate(){e.textContent=t.slice(0,o.n|0)}},'<').to(e,{opacity:0,duration:1.2,delay:d})}
function story(pr){chap.m.forEach(([p,t],i)=>{if(pr>=p-.001&&!shown.has(i)&&p<1){shown.add(i);mono(t)}})}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function record(result){await db.ins('runs',{profile_id:uid,save_id:save?.id??null,chapter_id:chap.id,result,time_ms:Math.round(performance.now()-t0),moves,max_progress:+maxP.toFixed(3)})}
async function summit(){
 state='end';record('summit');mono(chap.m.at(-1)[1],5);
 gsap.to(cam.position,{z:cam.position.z+8,y:cam.position.y+3,duration:4,ease:'power1.inOut'});
 if(save){const nx=Math.max(save.chapters_unlocked,Math.min(6,chap.id+1));save.chapters_unlocked=nx;save.chapter_id=Math.min(6,chap.id+1);
  await db.upd('save_games',save.id,{chapters_unlocked:nx,chapter_id:save.chapter_id,altitude:chap.base+chap.H*10,stamina:stam,updated_at:new Date().toISOString()})}
 await wait(6500);openMenu()}
async function fall(){
 state='end';record('fall');mono('Minhas mãos... não respondem mais.',3);
 gsap.to(body.position,{y:'-=40',z:'+=6',duration:1.6,ease:'power2.in'});gsap.to(hand.position,{y:'-=40',duration:1.6,ease:'power2.in'});
 gsap.to(cam.position,{x:()=>(Math.random()-.5)*2,duration:.08,repeat:8,yoyo:true});
 await wait(2800);startChapter(chap)}

/* ===== CRUD de saves + menu ===== */
async function renderMenu(){

  const[b1,b2,b3]=d.querySelectorAll('button');b1.onclick=()=>{save=s;renderMenu()};
  b2.onclick=async()=>{const n=prompt('Novo nome do save',s.slot_name);if(n){await db.upd('save_games',s.id,{slot_name:n});renderMenu()}};
  b3.onclick=async()=>{if(confirm('Excluir este save?')){await db.del('save_games',s.id);if(save?.id==s.id)save=null;renderMenu()}};
  $('#slots').append(d)});

 CH.forEach(c=>{const b=document.createElement('button');b.className='btn ch';b.disabled=c.id>un;
  b.innerHTML=`Cap. ${c.id} — ${c.t}<small>${c.s}</small>`;b.onclick=async()=>{if(!save)save=await db.ins('save_games',{profile_id:uid,slot_name:'Save '+(ss.length+1),chapter_id:1,chapters_unlocked:1,altitude:0,stamina:100});startChapter(c)};$('#chs').append(b)})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== Input ===== */
const K={ArrowUp:[0,1],w:[0,1],ArrowDown:[0,-1],s:[0,-1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{if(K[e.key])move(...K[e.key]);if(e.code==='Space'){resting=true;e.preventDefault()}});

/* ===== Loop ===== */
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),T=clk.elapsedTime;
 if(state==='play'){
  stam=Math.max(0,Math.min(100,stam+(resting?Math.max(8,24-chap.cold*8):-chap.cold*1.2)*dt));
  if(stam<=0)fall();
  gust-=dt;if(chap.wind>0&&gust<=0){gust=6+Math.random()*8;stam=Math.max(0,stam-9*chap.wind);
   gsap.fromTo('#warn',{opacity:.9},{opacity:0,duration:1.8});gsap.fromTo(cam.position,{x:cam.position.x-.5},{x:cam.position.x,duration:.9,ease:'elastic.out(1,.4)'})}}
 if(state==='cine')cam.lookAt(lookT);else if(cur){const tx=body.position.x*.35,ty=body.position.y+2.2+(state==='end'?0:0);
  if(state!=='end'||true){cam.position.x+=(tx-cam.position.x)*Math.min(1,dt*3);cam.position.y+=(ty-cam.position.y)*Math.min(1,dt*2.5);
   if(state!=='end')cam.position.z+=(9-cam.position.z)*Math.min(1,dt*1.5)}
  cam.lookAt(body.position.x*.5,cam.position.y+1.4+Math.sin(T*.5)*.05,0)}
 body.rotation.z=Math.sin(T*1.3)*.03;hand.children.forEach((h,i)=>h.position.y=.5+Math.sin(T*2+i)*.02);
 const p=snow.geometry.attributes.position,w=chap.wind;
 for(let i=0;i<p.count;i++){let x=p.getX(i)+(.6+w*3)*dt,y=p.getY(i)-(.8+w)*dt;
